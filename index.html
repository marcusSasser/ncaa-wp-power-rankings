<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power Rankings</title>
  <style>
    body {
      font-family: Calibri, sans-serif;
      background: #fff;
      color: #000;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95em;
    }
    thead {
      background: #f2f2f2;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #ccc;
      text-align: left;
    }
    tr:hover {
      background: #fafafa;
    }
    th {
      font-weight: bold;
    }
    .rank {
      text-align: right;
      width: 50px;
      color: #555;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>NCAA Football</h1>

  <table>
    <thead>
      <tr>
        <th class="rank">Ranking</th>
        <th>Team</th>
        <th>Record</th>
        <th>Conf</th>
        <th>SubDiv</th>
        <th>Rating</th>
        <th>MoV</th>
        <th>SoS</th>
        <th>Last Year</th>
        <th>Resume</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="rank">1</td>
        <td>Team A</td>
        <td>5–0</td>
        <td>95.4</td>
        <td>+2</td>
      </tr>
      <tr>
        <td class="rank">2</td>
        <td>Team B</td>
        <td>4–1</td>
        <td>93.2</td>
        <td>-1</td>
      </tr>
      <tr>
        <td class="rank">3</td>
        <td>Team C</td>
        <td>3–2</td>
        <td>89.7</td>
        <td>+0</td>
      </tr>
      <tr>
        <td class="rank">4</td>
        <td>Team D</td>
        <td>3–2</td>
        <td>88.3</td>
        <td>-1</td>
      </tr>
      <tr>
        <td class="rank">5</td>
        <td>Team E</td>
        <td>2–3</td>
        <td>85.1</td>
        <td>+1</td>
      </tr>
    </tbody>
  </table>

  <footer>
    Last updated: Through Week 3
  </footer>
</body>
</html>

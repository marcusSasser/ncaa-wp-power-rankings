<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power Rankings</title>
  <style>
    body {
      font-family: Calibri, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
    }
    h1 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #ccc;
      text-align: left;
    }
    thead {
      background: #f2f2f2;
    }
    tr:hover {
      background: #fafafa;
    }
    .rank {
      text-align: right;
      width: 50px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Power Rankings</h1>

  <table id="rankings">
    <thead>
      <tr>
        <th>Rank</th>
        <th>Team</th>
        <th>Record</th>
        <th>Conf</th>
        <th>SubDiv</th>
        <th>Rating</th>
        <th>MoV</th>
        <th>SoS</th>
        <th>Last Year</th>
        <th>Resume</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadSheet() {
      const url = "https://spreadsheets.google.com/feeds/list/2PACX-1vQNb2wzYrdN69JIljx2w4SNEtZUnf6gRTTORASJ0FEmVNrFvwfNOO1bCqVyxjvcIaer4FA5p6meqnxo/1/public/values?alt=json";
      const res = await fetch(url);
      const data = await res.json();

      let rows = data.feed.entry.map(r => ({
        rank: r.gsx$ranking.$t,
        team: r.gsx$team.$t,
        record: r.gsx$record.$t,
        conf: r.gsx$conf.$t,
        subdiv: r.gsx$subdiv.$t,
        rating: r.gsx$rating.$t,
        mov: r.gsx$mov.$t,
        sos: r.gsx$sos.$t,
        last_year: r.gsx$last_year.$t,
        resume: r.gsx$resume.$t
      }));

      let tbody = document.querySelector("#rankings tbody");
      rows.forEach(row => {
        let tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="rank">${row.ranking}</td>
          <td>${row.team}</td>
          <td>${row.record}</td>
          <td>${row.conf}</td>
          <td>${row.subdiv}</td>
          <td>${row.rating}</td>
          <td>${row.mov}</td>
          <td>${row.sos}</td>
          <td>${row.last_year}</td>
          <td>${row.resume}</td>
        `;
        tbody.appendChild(tr);
      });
    }
    loadSheet();
  </script>
</body>
</html>
